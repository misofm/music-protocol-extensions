[package]
name = "release_genre"
edition = "2024"
license = "FSL-1.1-ALv2"
authors = ["Miso Labs, Inc. (build@miso.fm)"]

# One concern, one package: the release's own genre classification and
# nothing else. It needs only the shared genre vocabulary and musicos core, to
# prove vocabulary membership and to operate on `Release` through its
# cap-gated `uid_mut`.
[dependencies]
genre = { git = "https://github.com/misofm/genre.git", rev = "90baae2919f7272f6d4bbb245b643f7dba5dc0ba" }
musicos = { git = "https://github.com/misofm/musicos.git", rev = "f613a89fadf57e180bc3ba910adbccf764bc08bc" }
